name: Build ChatRenderCLI

on:
  push:
  workflow_dispatch:

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure Embedded Emoji Zip Resources Exist
        shell: pwsh
        run: |
          if (!(Test-Path "TwitchDownloaderCore/Resources/twemoji-17.0.3.zip")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/lay295/TwitchDownloader/master/TwitchDownloaderCore/Resources/twemoji-17.0.3.zip" -OutFile "TwitchDownloaderCore/Resources/twemoji-17.0.3.zip"
          }
          if (!(Test-Path "TwitchDownloaderCore/Resources/noto-emoji-2.051.zip")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/lay295/TwitchDownloader/master/TwitchDownloaderCore/Resources/noto-emoji-2.051.zip" -OutFile "TwitchDownloaderCore/Resources/noto-emoji-2.051.zip"
          }

      - name: Publish ChatRenderCLI (win-x64)
        run: dotnet publish TwitchDownloaderCLI/TwitchDownloaderCLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Verify ChatRenderCLI.exe exists
        shell: pwsh
        run: |
          if (!(Test-Path "./publish/ChatRenderCLI.exe")) {
            Write-Error "ChatRenderCLI.exe was not created in ./publish"
            exit 1
          }

      - name: Upload ChatRenderCLI.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-win-x64
          path: ./publish/ChatRenderCLI.exe
