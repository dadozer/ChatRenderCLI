name: Build ChatRenderCLI & ChatRenderGUI

on:
  push:
  workflow_dispatch:

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure Embedded Emoji Zip Resources Exist
        shell: pwsh
        run: |
          if (!(Test-Path "TwitchDownloaderCore/Resources/twemoji-17.0.3.zip")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/lay295/TwitchDownloader/master/TwitchDownloaderCore/Resources/twemoji-17.0.3.zip" -OutFile "TwitchDownloaderCore/Resources/twemoji-17.0.3.zip"
          }
          if (!(Test-Path "TwitchDownloaderCore/Resources/noto-emoji-2.051.zip")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/lay295/TwitchDownloader/master/TwitchDownloaderCore/Resources/noto-emoji-2.051.zip" -OutFile "TwitchDownloaderCore/Resources/noto-emoji-2.051.zip"
          }

      - name: Publish ChatRenderCLI.exe (win-x64)
        run: dotnet publish TwitchDownloaderCLI/TwitchDownloaderCLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./dist/win-x64

      - name: Publish ChatRenderGUI.exe (win-x64)
        run: dotnet publish TwitchDownloaderWPF/TwitchDownloaderWPF.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./dist/win-x64

      - name: Verify Executables Exist
        shell: pwsh
        run: |
          if (!(Test-Path "./dist/win-x64/ChatRenderCLI.exe")) {
            Write-Error "ChatRenderCLI.exe was not created in ./dist/win-x64"
            exit 1
          }
          if (!(Test-Path "./dist/win-x64/ChatRenderGUI.exe")) {
            Write-Error "ChatRenderGUI.exe was not created in ./dist/win-x64"
            exit 1
          }

      - name: Upload ChatRender-win-x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatRender-win-x64
          path: |
            ./dist/win-x64/ChatRenderCLI.exe
            ./dist/win-x64/ChatRenderGUI.exe
