name: Build and Upload Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: '1.0.0'

jobs:
  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=Windows -p:DebugType=Embedded
      - name: Upload Windows CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-Windows-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/Windows/

  build-cli-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Linux CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=Linux -p:DebugType=Embedded
      - name: Build LinuxAlpine CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=LinuxAlpine -p:DebugType=Embedded
      - name: Build LinuxArm CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=LinuxArm -p:DebugType=Embedded
      - name: Build LinuxArm64 CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=LinuxArm64 -p:DebugType=Embedded
      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-Linux-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/Linux/
      - name: Upload LinuxAlpine CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-LinuxAlpine-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/LinuxAlpine/
      - name: Upload LinuxArm CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-LinuxArm
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/LinuxArm/
      - name: Upload LinuxArm64 CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-LinuxArm64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/LinuxArm64/

  build-cli-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build MacOS CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=MacOS -p:DebugType=Embedded
      - name: Build MacOSArm64 CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=MacOSArm64 -p:DebugType=Embedded
      - name: Upload MacOS CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-MacOS-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/MacOS/
      - name: Upload MacOSArm64 CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-${{ github.event.inputs.release_tag }}-MacOSArm64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/MacOSArm64/
