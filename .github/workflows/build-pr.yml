name: Build and Upload Pull Request

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, reopened ]

jobs:
  run-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run TwitchDownloaderCLI Tests
        run: dotnet test TwitchDownloaderCLI.Tests
      - name: Run TwitchDownloaderCore Tests
        run: dotnet test TwitchDownloaderCore.Tests

  build-cli:
    runs-on: ubuntu-24.04
    needs: [run-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=Windows -p:DebugType=Portable
      - name: Build Linux CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=Linux -p:DebugType=Portable
      - name: Build LinuxAlpine CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=LinuxAlpine -p:DebugType=Portable
      - name: Build LinuxArm CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=LinuxArm -p:DebugType=Portable
      - name: Build LinuxArm64 CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=LinuxArm64 -p:DebugType=Portable

      - name: Upload Windows CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-Windows-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/Windows/

      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-Linux-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/Linux/

      - name: Upload LinuxAlpine CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-LinuxAlpine-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/LinuxAlpine/

      - name: Upload LinuxArm CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-LinuxArm
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/LinuxArm/

      - name: Upload LinuxArm64 CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-LinuxArm64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/LinuxArm64/

  build-cli-mac:
    runs-on: macos-latest
    needs: [build-cli]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build MacOS CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=MacOS -p:DebugType=Portable
      - name: Build MacOSArm64 CLI
        run: dotnet publish TwitchDownloaderCLI -p:PublishProfile=MacOSArm64 -p:DebugType=Portable

      - name: Upload MacOS CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-MacOS-x64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/MacOS/

      - name: Upload MacOSArm64 CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatRenderCLI-MacOSArm64
          path: TwitchDownloaderCLI/bin/Release/net10.0/publish/MacOSArm64/
